<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My World Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232b;
    --navy:#1c3a4d;
    --navy-deep:#0e2130;
    --parchment:#e9e1cd;
    --parchment-light:#f3eee0;
    --brass:#b6862c;
    --stamp-red:#8a3b2e;
    --city-accent: var(--stamp-red);
    --line: rgba(22,35,43,0.14);
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--navy-deep);
    color: var(--parchment-light);
    font-family: var(--sans);
    min-height:100vh;
  }
  a{color:inherit;}

  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    min-height:100vh;
  }
  @media (max-width: 880px){
    .app{grid-template-columns: 1fr;}
    .sidebar{
      max-height: 46vh;
      overflow-y:auto;
      border-right:none;
      border-bottom: 1px solid rgba(233,225,205,0.15);
    }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: var(--navy-deep);
    border-right: 1px solid rgba(233,225,205,0.15);
    padding: 28px 0 40px;
  }
  .brand{
    padding: 0 24px 22px;
    border-bottom: 1px solid rgba(233,225,205,0.15);
    margin-bottom: 10px;
  }
  .brand .kicker{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--brass);
    margin: 0 0 6px;
  }
  .brand h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    line-height:1.15;
    margin:0 0 8px;
    color: var(--parchment-light);
  }
  .brand p{
    font-size: 13px;
    line-height:1.5;
    color: rgba(233,225,205,0.65);
    margin:0;
  }

  .route-list{ padding: 10px 0; }
  .route-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 12px 24px;
    cursor:pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .route-item:hover{ background: rgba(233,225,205,0.05); }
  .route-item.active{
    background: rgba(182,134,44,0.12);
    border-left-color: var(--brass);
  }
  .route-item.locked{ opacity: 0.4; cursor:default; }
  .route-item.locked:hover{ background:none; }

  .route-num{
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(233,225,205,0.5);
    width: 20px;
    flex-shrink:0;
  }
  .route-info{ min-width:0; flex:1; }
  .route-city{
    font-family: var(--serif);
    font-size: 16px;
    font-weight:500;
    color: var(--parchment-light);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .route-country{
    font-size: 11.5px;
    color: rgba(233,225,205,0.5);
  }
  .route-status{
    font-size: 16px;
    flex-shrink:0;
  }

  /* ---------- Main panel ---------- */
  .main{
    background: var(--parchment);
    color: var(--ink);
    padding: 48px 56px 80px;
  }
  @media (max-width: 620px){
    .main{ padding: 32px 20px 60px; }
  }
  .main-inner{ max-width: 760px; margin: 0 auto; }

  .locked-state{
    max-width: 480px;
    margin: 80px auto;
    text-align:center;
  }
  .locked-state h2{
    font-family: var(--serif);
    font-size: 28px;
    margin-bottom: 10px;
  }
  .locked-state p{
    color: rgba(22,35,43,0.6);
    line-height:1.6;
    font-size:15px;
  }

  .city-header{
    border-bottom: 1px solid var(--line);
    padding-bottom: 26px;
    margin-bottom: 28px;
  }
  .city-flag-line{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing:0.04em;
    color: var(--stamp-red);
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  .city-header h2, .city-hero h2{
    font-family: var(--serif);
    font-weight:600;
    font-size: 42px;
    line-height: 1.05;
    margin: 0 0 12px;
  }
  .city-hero h2{ margin: 0; }
  .city-identity{
    font-size: 16px;
    line-height:1.6;
    color: rgba(22,35,43,0.72);
    margin:0;
    max-width: 60ch;
  }
  .city-hero .city-identity{ margin-top: 12px; }

  .hotel-card{
    display:flex;
    gap:16px;
    align-items:flex-start;
    background: var(--parchment-light);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px;
    margin: 22px 0 30px;
  }
  .hotel-card .icon{
    font-size: 22px;
    line-height:1;
    margin-top:2px;
  }
  .hotel-card h4{
    margin:0 0 4px;
    font-family: var(--serif);
    font-size:16px;
    font-weight:600;
  }
  .hotel-card p{
    margin:0;
    font-size: 13.5px;
    color: rgba(22,35,43,0.65);
    line-height:1.5;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 34px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: rgba(22,35,43,0.1);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--stamp-red);
    border-radius:3px;
    transition: width 0.3s ease;
  }
  .progress-label{
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(22,35,43,0.6);
    white-space:nowrap;
  }

  .section-label{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing:0.04em;
    text-transform: uppercase;
    color: rgba(22,35,43,0.5);
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .experience{
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--parchment-light);
    margin-bottom: 12px;
    overflow:hidden;
  }
  .experience-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding: 16px 18px;
    cursor:pointer;
  }
  .checkbox{
    width:20px;
    height:20px;
    border-radius:50%;
    border: 1.5px solid rgba(22,35,43,0.35);
    flex-shrink:0;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .experience.done .checkbox{
    background: var(--stamp-red);
    border-color: var(--stamp-red);
    color: var(--parchment-light);
  }
  .experience-body{ flex:1; min-width:0; }
  .experience-title-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:baseline;
  }
  .experience-title{
    font-family: var(--serif);
    font-weight:600;
    font-size: 17px;
  }
  .experience.done .experience-title{
    text-decoration: line-through;
    text-decoration-color: rgba(22,35,43,0.35);
    color: rgba(22,35,43,0.55);
  }
  .experience-tag{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--navy);
    background: rgba(28,58,77,0.08);
    padding: 2px 7px;
    border-radius: 3px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .experience-desc{
    font-size: 13.5px;
    line-height:1.55;
    color: rgba(22,35,43,0.68);
    margin: 6px 0 0;
  }
  .experience-task{
    font-size: 12.5px;
    color: rgba(22,35,43,0.5);
    margin: 8px 0 0;
    font-style: italic;
  }

  .optional-wrap{ margin-top: 8px; }
  .optional{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .optional:last-child{ border-bottom:none; }
  .opt-check{
    width:16px; height:16px;
    border-radius:50%;
    border: 1.5px solid rgba(22,35,43,0.3);
    margin-top:3px;
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:10px;
  }
  .optional.done .opt-check{ background: var(--brass); border-color: var(--brass); color:var(--parchment-light); }
  .optional-name{ font-weight:600; font-size:14px; }
  .optional.done .optional-name{ text-decoration: line-through; color: rgba(22,35,43,0.5); }
  .optional-desc{ font-size: 12.5px; color: rgba(22,35,43,0.6); margin-top:2px; line-height:1.5; }

  .task-input-row{
    display:flex;
    gap:8px;
    margin-top: 10px;
  }
  .task-input-row input{
    flex:1;
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  .task-input-row button{
    font-family: var(--sans);
    font-size: 13px;
    font-weight:500;
    padding: 8px 14px;
    border: none;
    border-radius: 3px;
    background: var(--navy);
    color: var(--parchment-light);
    cursor:pointer;
  }
  .task-input-row button:hover{ background: var(--navy-deep); }

  .complete-banner{
    margin-top: 34px;
    padding: 22px 24px;
    border: 1px dashed var(--city-accent, var(--stamp-red));
    border-radius: 4px;
    background: rgba(138,59,46,0.06);
    background: color-mix(in srgb, var(--city-accent, var(--stamp-red)) 8%, transparent);
  }
  .complete-banner h3{
    font-family: var(--serif);
    margin: 0 0 10px;
    font-size: 19px;
    color: var(--city-accent, var(--stamp-red));
  }
  .complete-banner p{
    margin:0 0 14px;
    font-size: 13.5px;
    color: rgba(22,35,43,0.7);
    line-height:1.6;
  }
  .complete-banner p:last-child{ margin-bottom:0; }
  .banner-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .status-check{ color: var(--stamp-red); }

  /* ---------- Nav + stats ---------- */
  .journey-stats{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--brass);
    margin: 10px 0 0 !important;
    letter-spacing: 0.02em;
  }
  .view-nav{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 12px 16px 8px;
  }
  .view-nav button{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 6px;
    border: 1px solid rgba(233,225,205,0.18);
    background: transparent;
    color: rgba(233,225,205,0.7);
    border-radius: 3px;
    cursor: pointer;
  }
  .view-nav button:hover{ background: rgba(233,225,205,0.06); color: var(--parchment-light); }
  .view-nav button.active{
    background: rgba(182,134,44,0.18);
    border-color: var(--brass);
    color: var(--parchment-light);
  }

  /* ---------- City atmosphere ---------- */
  .city-page{ --city-accent: var(--stamp-red); }
  .city-hero{
    border-bottom: 1px solid var(--line);
    padding-bottom: 26px;
    margin-bottom: 22px;
    position: relative;
  }
  .city-hero::before{
    content:"";
    position:absolute;
    left:-12px; top:0;
    width:4px; height:100%;
    background: var(--city-accent);
    border-radius: 2px;
  }
  .city-title-row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:flex-end;
    flex-wrap:wrap;
  }
  .local-time{
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(22,35,43,0.55);
    text-align:right;
  }
  .boarding-today{
    background: var(--parchment-light);
    border: 1px dashed var(--city-accent);
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 22px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
  }
  .boarding-today .k{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--city-accent);
    margin: 0 0 4px;
  }
  .boarding-today .n{
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
  }
  .boarding-today button{
    font-family: var(--sans);
    font-size: 12px;
    padding: 7px 12px;
    border: none;
    border-radius: 3px;
    background: var(--navy);
    color: var(--parchment-light);
    cursor: pointer;
    white-space: nowrap;
  }
  .hotel-card .hotel-meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--city-accent);
    margin-top: 8px;
  }
  .progress-fill{ background: var(--city-accent); }

  /* ---------- Explore + arrive ---------- */
  .experience-head{ cursor: default; }
  .experience.done .checkbox{ cursor: pointer; }
  .explore-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top: 10px;
  }
  .explore-link{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--navy);
    text-decoration: none;
  }
  .explore-link:hover{ border-color: var(--navy); }
  .explore-link.used{ border-color: var(--city-accent); color: var(--city-accent); }
  .timer-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top: 10px;
  }
  .timer-row button, .ghost-btn{
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .timer-row button:hover, .ghost-btn:hover{ border-color: var(--navy); }
  .timer-display{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--city-accent);
  }
  .arrive-fields{ margin-top: 10px; display:flex; flex-direction:column; gap:8px; }
  .arrive-fields input{
    width:100%;
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  .arrive-actions{ display:flex; gap:8px; }
  .arrive-actions button[data-arrive]{
    font-family: var(--sans);
    font-size: 13px;
    font-weight:500;
    padding: 8px 14px;
    border: none;
    border-radius: 3px;
    background: var(--navy);
    color: var(--parchment-light);
    cursor:pointer;
  }
  .arrive-actions button[data-arrive]:hover{ background: var(--navy-deep); }
  .journal-line{
    font-size: 13px;
    color: rgba(22,35,43,0.72);
    margin: 8px 0 0;
    font-style: italic;
  }
  .arrived-date{
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(22,35,43,0.45);
    margin-top: 6px;
  }
  .checkbox.stamp-pop{
    animation: stampIn 0.45s cubic-bezier(.2,1.4,.3,1) both;
  }
  @keyframes stampIn{
    0%{ transform: scale(1.8) rotate(-18deg); opacity:0; }
    55%{ transform: scale(0.9) rotate(-10deg); opacity:1; }
    100%{ transform: scale(1) rotate(0deg); opacity:1; }
  }

  /* ---------- Page headers ---------- */
  .page-kicker{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--stamp-red);
    margin: 0 0 8px;
  }
  .page-title{
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 600;
    margin: 0 0 8px;
    line-height: 1.1;
  }
  .page-lead{
    font-size: 15px;
    line-height: 1.6;
    color: rgba(22,35,43,0.65);
    margin: 0 0 28px;
    max-width: 58ch;
  }
  .stat-row{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin: 0 0 28px;
  }
  .stat-row .stat b{
    display:block;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
  }
  .stat-row .stat span{
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(22,35,43,0.5);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ---------- Map ---------- */
  .main.wide .main-inner{ max-width: 980px; }
  .chart-wrap{
    background: var(--navy-deep);
    border-radius: 6px;
    padding: 16px 12px 8px;
    overflow:hidden;
  }
  .chart-wrap svg{ width:100%; height:auto; display:block; }
  .chart-caption{
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(233,225,205,0.45);
    text-align:center;
    margin: 10px 0 0;
  }
  .chart-legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top: 16px;
    font-size: 12.5px;
    color: rgba(22,35,43,0.6);
  }
  .chart-legend i{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align: middle;
  }

  /* ---------- Passport ---------- */
  .stamp-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .stamp-card{
    aspect-ratio: 1;
    border: 1.5px dashed rgba(22,35,43,0.22);
    border-radius: 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 14px;
    background: var(--parchment-light);
    cursor: pointer;
  }
  .stamp-card.locked{ opacity: 0.4; cursor: default; }
  .stamp-card.here{ border-style: solid; border-color: var(--brass); }
  .stamp-card.inked{
    border-style: solid;
    border-color: var(--stamp-red);
    background:
      radial-gradient(circle at 30% 25%, rgba(138,59,46,0.08), transparent 50%),
      var(--parchment-light);
  }
  .stamp-badge{
    width: 72px; height: 72px;
    border: 3px solid var(--stamp-red);
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 28px;
    transform: rotate(-12deg);
    margin-bottom: 10px;
    color: var(--stamp-red);
    box-shadow: inset 0 0 0 2px rgba(138,59,46,0.25);
  }
  .stamp-card.here .stamp-badge{
    border-color: var(--brass);
    color: var(--brass);
    box-shadow: inset 0 0 0 2px rgba(182,134,44,0.25);
  }
  .stamp-card.locked .stamp-badge{
    border-color: rgba(22,35,43,0.25);
    color: rgba(22,35,43,0.3);
    box-shadow: none;
  }
  .stamp-city{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
  }
  .stamp-date{
    font-family: var(--mono);
    font-size: 10.5px;
    color: rgba(22,35,43,0.5);
    margin-top: 4px;
  }

  /* ---------- Journal ---------- */
  .journal-entry{
    border-left: 3px solid var(--stamp-red);
    padding: 4px 0 18px 16px;
    margin-bottom: 6px;
  }
  .journal-entry .when{
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(22,35,43,0.45);
  }
  .journal-entry h4{
    font-family: var(--serif);
    font-size: 18px;
    margin: 4px 0;
  }
  .journal-entry .via{
    font-size: 13.5px;
    color: rgba(22,35,43,0.7);
    margin: 0;
  }
  .journal-entry .note{
    font-size: 14px;
    font-style: italic;
    color: var(--ink);
    margin: 8px 0 0;
  }
  .empty-state{
    text-align:center;
    padding: 50px 20px;
    color: rgba(22,35,43,0.55);
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background: rgba(14,33,48,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 40;
    padding: 24px;
  }
  .ceremony-card, .flight-card{
    background: var(--parchment);
    color: var(--ink);
    max-width: 440px;

/* ---------------- UNLOCK LOGIC ----------------
   Stop 0 is always unlocked. Every later stop unlocks only once the
   previous stop (a) has a built City Experience Map and (b) that map's
   core experiences are all marked complete. A stop can be "unlocked"
   before it has map content — that just means it's next in line to be
   built, and the app will offer a ready-made prompt for building it. */
function emptyProgress(){
  return { core:{}, optional:{}, tasks:{}, notes:{}, arrivedAt:{}, explored:{}, optionalAt:{} };
}
function normalizeProgress(data){
  const base = emptyProgress();
  if (!data || typeof data !== 'object') return base;
  return {
    ...base,
    ...data,
    core: data.core || {},
    optional: data.optional || {},
    tasks: data.tasks || {},
    notes: data.notes || {},
    arrivedAt: data.arrivedAt || {},
    explored: data.explored || {},
    optionalAt: data.optionalAt || {}
  };
}
function isCityComplete(city, prog){
  if (!city.map || !prog) return false;
  return city.map.core.every(exp => !!prog.core[exp.id]);
}
async function isUnlocked(index){
  if (index === 0) return true;
  const prev = ROUTE[index - 1];
  if (!prev.map) return false;
  const prevProg = await loadProgress(prev.id);
  return isCityComplete(prev, prevProg);
}
function buildCityPrompt(city){
  return `Build the City Experience Map for ${city.city}, ${city.country} — same format as the Kathmandu one: one-line city identity, one line on why it's next on the route (geography/flight logic), a top/iconic hotel pick with a one-line reason, 5 core experiences (each with name, category tag, 2-line description, and a 15-30 min virtual exploration idea), 6 optional side experiences (name + 1-line description), and a suggested next capital with routing reason.`;
}

/* ---------------- HELPERS ---------------- */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function shortCity(city){
  return city.city.split(' (')[0];
}
function hotelShort(city){
  return city.map ? city.map.hotel.name.split(',')[0] : '';
}
function formatDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function formatLocalTime(tz){
  try{
    const d = new Date();
    const time = d.toLocaleTimeString('en-GB', { timeZone: tz, hour:'2-digit', minute:'2-digit' });
    const day = d.toLocaleDateString('en-GB', { timeZone: tz, weekday:'short', day:'numeric', month:'short' });
    return `${time} · ${day} local`;
  }catch(e){ return ''; }
}
function startClock(tz){
  clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById('localTime');
    if (!el){ clearInterval(clockTimer); return; }
    el.textContent = formatLocalTime(tz);
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}
function haversine(a, b){
  if (!a || !b || a.lat == null || b.lat == null) return 0;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function exploreLinks(exp, city){
  const q = encodeURIComponent(`${exp.name} ${city.city} ${city.country}`);
  const maps = encodeURIComponent(`${exp.name}, ${city.city}`);
  const links = [
    { id:'maps', label:'Maps', href:`https://www.google.com/maps/search/?api=1&query=${maps}` },
    { id:'wiki', label:'Wikipedia', href:`https://en.wikipedia.org/wiki/Special:Search?search=${q}` },
    { id:'watch', label:'Watch', href:`https://www.youtube.com/results?search_query=${q}` }
  ];
  if (/food|cuisine|market/i.test(`${exp.tag} ${exp.name}`)){
    links.push({ id:'recipe', label:'Recipe', href:`https://www.google.com/search?q=${encodeURIComponent(exp.name + ' recipe')}` });
  }
  return links;
}
function playTone(freq, dur, type, vol){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.45), audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){ /* autoplay / unsupported */ }
}
function playStamp(){ playTone(90, 0.16, 'triangle', 0.14); }
function playCeremony(){
  playTone(220, 0.18, 'sine', 0.1);
  setTimeout(() => playTone(330, 0.22, 'sine', 0.09), 120);
}

/* ---------------- STORAGE HELPERS ---------------- */
async function storageGet(key){
  try{
    if (window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(key);
      if (res && res.value) return res.value;
    }
  }catch(e){ /* fall through */ }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if (window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, value);
    }
  }catch(e){ /* fall through */ }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('Could not save progress', e); }
}
async function loadProgress(id){
  if (progressCache[id]) return progressCache[id];
  let data = emptyProgress();
  try{
    const raw = await storageGet('progress:' + id);
    if (raw) data = normalizeProgress(JSON.parse(raw));
  }catch(e){ /* no saved progress yet */ }
  progressCache[id] = data;
  return data;
}
async function saveProgress(id){
  await storageSet('progress:' + id, JSON.stringify(progressCache[id]));
}

/* ---------------- JOURNEY STATS ---------------- */
async function journeyStats(){
  let cities = 0, arrivals = 0, journal = 0, km = 0;
  let lastComplete = null;
  for (const city of ROUTE){
    const prog = await loadProgress(city.id);
    if (city.map){
      const done = city.map.core.filter(exp => prog.core[exp.id]).length;
      arrivals += done;
      journal += city.map.core.filter(exp => prog.notes[exp.id] || prog.tasks[exp.id]).length;
      if (isCityComplete(city, prog)){
        cities += 1;
        if (lastComplete) km += haversine(lastComplete, city);
        lastComplete = city;
      }
    }
  }
  return { cities, arrivals, journal, km: Math.round(km) };
}

    if (unlocked){

  }

        const note = div.querySelector(`input[data-note="${exp.id}"]`);
        const wasComplete = isCityComplete(city, prog);
        prog.tasks[exp.id] = input.value.trim();
        prog.notes[exp.id] = note.value.trim();
        prog.core[exp.id] = true;
        prog.arrivedAt[exp.id] = new Date().toISOString();
        justArrivedId = exp.id;
        const nowComplete = isCityComplete(city, prog);
        if (nowComplete && !wasComplete){
          prog.completedAt = new Date().toISOString();
          ceremonyCityId = city.id;
        }
        await saveProgress(city.id);
        playStamp();
        if (nowComplete && !wasComplete) playCeremony();
        renderAll();
      });
    } else {
      div.querySelector('.checkbox').addEventListener('click', async () => {
        prog.core[exp.id] = false;
        if (prog.completedAt) delete prog.completedAt;
        await saveProgress(city.id);
        renderAll();
      });
    }
  });
  if (justArrivedId) justArrivedId = null;

  const optList = document.getElementById('optionalList');
  m.optional.forEach(opt => {
    const isDone = !!prog.optional[opt.name];
    const q = encodeURIComponent(`${opt.name} ${city.city}`);
    const div = document.createElement('div');
    div.className = 'optional' + (isDone ? ' done' : '');
    div.innerHTML = `
      <div class="opt-check">${isDone ? '✓' : ''}</div>
      <div>
        <div class="optional-name">${esc(opt.name)}</div>
        <div class="optional-desc">${esc(opt.desc)}</div>
        <div class="explore-row">
          <a class="explore-link" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener noreferrer">Look up</a>
        </div>
      </div>
    `;
    div.querySelector('.opt-check').addEventListener('click', async () => {
      prog.optional[opt.name] = !isDone;
      if (!isDone) prog.optionalAt[opt.name] = new Date().toISOString();
      else delete prog.optionalAt[opt.name];
      await saveProgress(city.id);
      renderAll();
    });
    optList.appendChild(div);
  });

  const banner = document.getElementById('completeBanner');
  if (complete){
    banner.innerHTML = `
      <div class="complete-banner">
        <h3>${esc(shortCity(city))} is complete</h3>
        <p>Checked out of ${esc(hotelShort(city))}. Passport stamped ${esc(formatDate(prog.completedAt) || 'today')}.</p>
        <p>Suggested next stop: ${esc(m.next)}</p>
        <div class="banner-actions">
          ${nextOpen ? `<button type="button" class="btn-primary" id="flyNext">Board the next flight</button>` : ''}
          <button type="button" class="btn-ghost" id="seePassport">View passport</button>
        </div>
      </div>`;
    document.getElementById('seePassport')?.addEventListener('click', () => {
      currentView = 'passport';
      renderAll();
    });
    document.getElementById('flyNext')?.addEventListener('click', () => startFlight(city, nextCity));
  }
}

function startExploreTimer(expId, btn){
  if (exploreTimers[expId]){
    clearInterval(exploreTimers[expId].id);
    delete exploreTimers[expId];
    btn.textContent = 'Start 15 min';
    const display = document.getElementById('timer-' + expId);
    if (display) display.textContent = '';
    return;
  }
  let left = 15 * 60;
  const display = document.getElementById('timer-' + expId);
  const tick = () => {
    const el = document.getElementById('timer-' + expId);
    if (!el){ clearInterval(exploreTimers[expId]?.id); delete exploreTimers[expId]; return; }
    const m = Math.floor(left / 60);
    const s = String(left % 60).padStart(2, '0');
    el.textContent = left <= 0 ? 'Time’s up — arrive when ready' : `${m}:${s}`;
    if (left <= 0){
      clearInterval(exploreTimers[expId].id);
      delete exploreTimers[expId];
      btn.textContent = 'Start 15 min';
      return;
    }
    left -= 1;
  };
  btn.textContent = 'Stop timer';
  tick();
  exploreTimers[expId] = { id: setInterval(tick, 1000) };
}

async function renderMap(el){
  const W = 860, H = 520, pad = 56;
  const lats = ROUTE.map(c => c.lat);
  const lngs = ROUTE.map(c => c.lng);
  const minLat = Math.min(...lats) - 3, maxLat = Math.max(...lats) + 3;
  const minLng = Math.min(...lngs) - 4, maxLng = Math.max(...lngs) + 4;
  const project = (city) => ({
    x: pad + ((city.lng - minLng) / (maxLng - minLng)) * (W - pad * 2),
    y: pad + ((maxLat - city.lat) / (maxLat - minLat)) * (H - pad * 2)
  });

  const pts = [];
  for (let i = 0; i < ROUTE.length; i++){
    const city = ROUTE[i];
    const unlocked = await isUnlocked(i);
    const prog = await loadProgress(city.id);
    const complete = isCityComplete(city, prog);
    pts.push({ city, unlocked, complete, p: project(city) });
  }

  let path = '';
  let flown = '';
  pts.forEach((pt, i) => {
    const cmd = `${i===0?'M':'L'}${pt.p.x.toFixed(1)},${pt.p.y.toFixed(1)} `;
    path += cmd;
    if (i === 0 || pts[i-1].complete) flown += cmd;
  });

  const grid = [];
  for (let lat = Math.ceil(minLat/5)*5; lat <= maxLat; lat += 5){
    const y = pad + ((maxLat - lat) / (maxLat - minLat)) * (H - pad * 2);
    grid.push(`<line x1="${pad}" y1="${y.toFixed(1)}" x2="${W-pad}" y2="${y.toFixed(1)}" stroke="rgba(233,225,205,0.08)"/>`);
    grid.push(`<text x="10" y="${(y+4).toFixed(1)}" fill="rgba(233,225,205,0.28)" font-size="10" font-family="IBM Plex Mono, monospace">${lat}°</text>`);
  }
  for (let lng = Math.ceil(minLng/5)*5; lng <= maxLng; lng += 5){
    const x = pad + ((lng - minLng) / (maxLng - minLng)) * (W - pad * 2);
    grid.push(`<line x1="${x.toFixed(1)}" y1="${pad}" x2="${x.toFixed(1)}" y2="${H-pad}" stroke="rgba(233,225,205,0.08)"/>`);
    grid.push(`<text x="${(x-8).toFixed(1)}" y="${H-18}" fill="rgba(233,225,205,0.28)" font-size="10" font-family="IBM Plex Mono, monospace">${lng}°</text>`);
  }

  const markers = pts.map(pt => {
    const fill = pt.complete ? '#8a3b2e' : pt.unlocked ? '#b6862c' : 'rgba(233,225,205,0.25)';
    const r = pt.city.id === currentId ? 8 : 5.5;
    const labelY = pt.p.y < 80 ? pt.p.y + 18 : pt.p.y - 12;
    return `
      <g class="map-node" data-id="${pt.city.id}" data-open="${pt.unlocked?1:0}" style="cursor:${pt.unlocked?'pointer':'default'}">
        <circle cx="${pt.p.x.toFixed(1)}" cy="${pt.p.y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${pt.city.id===currentId?'#f3eee0':'rgba(14,33,48,0.4)'}" stroke-width="2"/>
        <text x="${pt.p.x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" fill="#f3eee0" font-size="11" font-family="Fraunces, serif">${esc(shortCity(pt.city))}</text>
      </g>`;
  }).join('');

  el.innerHTML = `
    <p class="page-kicker">Flight chart</p>
    <h2 class="page-title">The route so far</h2>
    <p class="page-lead">A working chart of the capitals already on the board. Completed legs are inked; the rest of the path is still a planned heading.</p>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map of capitals">
        <rect width="${W}" height="${H}" fill="#0e2130"/>
        ${grid.join('')}
        <path d="${path.trim()}" fill="none" stroke="rgba(182,134,44,0.28)" stroke-width="1.5" stroke-dasharray="5 6"/>
        <path d="${flown.trim()}" fill="none" stroke="#b6862c" stroke-width="2.2"/>
        ${markers}
      </svg>
      <p class="chart-caption">South &amp; Central Asia · geographic / flight-cluster routing from Delhi outward</p>
    </div>
    <div class="chart-legend">
      <span><i style="background:#8a3b2e"></i>Completed</span>
      <span><i style="background:#b6862c"></i>Unlocked</span>
      <span><i style="background:rgba(22,35,43,0.35)"></i>Locked</span>
    </div>
  `;
  el.querySelectorAll('.map-node').forEach(g => {
    g.addEventListener('click', () => {
      if (g.dataset.open !== '1') return;
      currentId = g.dataset.id;
      currentView = 'city';
      renderAll();
    });
  });
}

async function renderPassport(el){
  const stats = await journeyStats();
  const cards = [];
  for (let i = 0; i < ROUTE.length; i++){
    const city = ROUTE[i];
    const unlocked = await isUnlocked(i);
    const prog = await loadProgress(city.id);
    const complete = isCityComplete(city, prog);
    const here = city.id === currentId && unlocked && !complete;
    let cls = 'stamp-card';
    let label = 'Locked';
    if (complete){ cls += ' inked'; label = formatDate(prog.completedAt) || 'Stamped'; }
    else if (here){ cls += ' here'; label = 'In residence'; }
    else if (unlocked){ cls += ' here'; label = city.map ? 'Open' : 'Awaiting map'; }
    else cls += ' locked';
    cards.push(`
      <div class="${cls}" data-id="${city.id}" data-open="${unlocked?1:0}">
        <div class="stamp-badge">${complete || here || unlocked ? city.flag : '—'}</div>
        <div class="stamp-city">${esc(shortCity(city))}</div>
        <div class="stamp-date">${esc(label)}</div>
      </div>`);
  }
  el.innerHTML = `
    <p class="page-kicker">Travel document</p>
    <h2 class="page-title">Passport</h2>
    <p class="page-lead">One inked stamp per finished capital. The current city stays open until you check out.</p>
    <div class="stat-row">
      <div class="stat"><b>${stats.cities}</b><span>Cities stamped</span></div>
      <div class="stat"><b>${stats.arrivals}</b><span>Arrivals</span></div>
      <div class="stat"><b>${stats.km.toLocaleString()}</b><span>Km flown</span></div>
    </div>
    <div class="stamp-grid">${cards.join('')}</div>
  `;
  el.querySelectorAll('.stamp-card').forEach(card => {
    card.addEventListener('click', () => {
      if (card.dataset.open !== '1') return;
      currentId = card.dataset.id;
      currentView = 'city';
      renderAll();
    });
  });
}

async function renderJournal(el){
  const entries = [];
  for (const city of ROUTE){
    if (!city.map) continue;
    const prog = await loadProgress(city.id);
    city.map.core.forEach(exp => {
      if (!prog.core[exp.id] && !prog.notes[exp.id] && !prog.tasks[exp.id]) return;
      if (!prog.core[exp.id]) return;
      entries.push({
        city,
        exp,
        task: prog.tasks[exp.id] || '',
        note: prog.notes[exp.id] || '',
        when: prog.arrivedAt[exp.id] || ''
      });
    });
    city.map.optional.forEach(opt => {
      if (!prog.optional[opt.name]) return;
      entries.push({
        city,
        exp: { name: opt.name, tag: 'Postcard' },
        task: 'Optional side experience',
        note: opt.desc,
        when: prog.optionalAt[opt.name] || ''
      });
    });
  }
  entries.sort((a, b) => String(b.when).localeCompare(String(a.when)));

  el.innerHTML = `
    <p class="page-kicker">Field notes</p>
    <h2 class="page-title">Journal</h2>
    <p class="page-lead">Every arrival is a line in the same story: the real task that got you there, and whatever the place left behind.</p>
    ${entries.length === 0 ? `
      <div class="empty-state">
        <p>No entries yet. Arrive at a core experience and optionally write how it felt — it will land here.</p>
      </div>` : entries.map(e => `
      <article class="journal-entry">
        <div class="when">${esc(e.city.flag)} ${esc(shortCity(e.city))} · ${esc(formatDate(e.when) || 'Undated')}</div>
        <h4>${esc(e.exp.name)}</h4>
        <p class="via">${e.task ? `Reached via: ${esc(e.task)}` : ''}</p>
        ${e.note ? `<p class="note">“${esc(e.note)}”</p>` : ''}
      </article>`).join('')}
  `;
}

function startFlight(from, to){
  if (!to) return;
  flightPair = { from, to };
  renderOverlays();
  setTimeout(() => {
    currentId = to.id;
    currentView = 'city';
    flightPair = null;
    renderAll();
  }, 2200);
}

function renderOverlays(){
  const root = document.getElementById('overlays');
  if (ceremonyCityId){
    const city = ROUTE.find(c => c.id === ceremonyCityId);
    const idx = ROUTE.findIndex(c => c.id === ceremonyCityId);
    const next = ROUTE[idx + 1];
    root.innerHTML = `
      <div class="overlay" id="ceremonyOverlay">
        <div class="ceremony-card">
          <div class="ceremony-stamp">${city.flag}</div>
          <h2>${esc(shortCity(city))} stamped</h2>
          <p>Checked out of ${esc(hotelShort(city))}. All five core experiences are done. The next capital is waiting on the route.</p>
          <div class="btn-row">
            ${next ? `<button type="button" class="btn-primary" id="ceremonyFly">Board the next flight</button>` : ''}
            <button type="button" class="btn-ghost" id="ceremonyPass">View passport</button>
            <button type="button" class="btn-ghost" id="ceremonyClose">Stay a little longer</button>
          </div>
        </div>
      </div>`;
    document.getElementById('ceremonyClose').addEventListener('click', () => {
      ceremonyCityId = null;
      renderOverlays();
    });
    document.getElementById('ceremonyPass').addEventListener('click', () => {
      ceremonyCityId = null;
      currentView = 'passport';
      renderAll();
    });
    document.getElementById('ceremonyFly')?.addEventListener('click', () => {
      ceremonyCityId = null;
      startFlight(city, next);
    });
    return;
  }
  if (flightPair){
    root.innerHTML = `
      <div class="overlay">
        <div class="flight-card">
          <p class="page-kicker" style="margin-bottom:8px">Now boarding</p>
          <div class="flight-route">
            <div class="end">${flightPair.from.flag} ${esc(shortCity(flightPair.from))}</div>
            <div class="flight-plane">✈</div>
            <div class="end">${flightPair.to.flag} ${esc(shortCity(flightPair.to))}</div>
          </div>
          <p>${esc(flightPair.from.map?.next || `Continuing on to ${shortCity(flightPair.to)}.`)}</p>
        </div>
      </div>`;
    return;
  }
  root.innerHTML = '';
}

async function renderAll(){
  renderNav();
  await renderSidebar();
  await renderMain();
  await renderSidebar();
  renderOverlays();
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  const idx = ROUTE.findIndex(c => c.id === currentId);
  if (e.key === 'j' || e.key === 'ArrowDown'){
    const next = ROUTE[idx + 1];
    if (!next) return;
    isUnlocked(idx + 1).then(ok => {
      if (!ok) return;
      currentId = next.id;
      currentView = 'city';
      renderAll();
    });
  }
  if (e.key === 'k' || e.key === 'ArrowUp'){
    const prev = ROUTE[idx - 1];
    if (!prev) return;
    currentId = prev.id;
    currentView = 'city';
    renderAll();
  }
});

renderAll();
</script>
